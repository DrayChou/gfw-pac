name: Auto Generate Release

on:
  push:
    paths:
      - 'gfw.template.pac'
  workflow_dispatch:

jobs:
  generate-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Git
        run: |
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"

      - name: Generate Release Name
        id: commit_count
        run: |
          today=$(TZ=Asia/Shanghai date +%Y%m%d)
          match_count=$(TZ=Asia/Shanghai git log --date=local --since="$today 00:00:00" --until="$today 23:59:59" --pretty=format: --name-only | grep -c '^gfw.template.pac$')
          commit_count=${match_count:-0}
          echo "COMMIT_COUNT=$commit_count" >> $GITHUB_ENV
          echo "RELEASE_NAME=v$(TZ='Asia/Shanghai' date +%Y%m%d).$commit_count" >> $GITHUB_ENV

      - name: Create Tag
        run: |
          git tag "${{ env.RELEASE_NAME }}"
          git push origin ${{ env.RELEASE_NAME }}

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "${{ env.RELEASE_NAME }}"
          name: "${{ env.RELEASE_NAME }}"
          body: "Auto generated release for gfw.template.pac update"
          draft: false
          prerelease: false
          files: gfw.template.pac
