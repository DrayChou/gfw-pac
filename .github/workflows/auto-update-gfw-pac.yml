name: GFW PAC Update (Submodule)

on:
  schedule:
    - cron: '0 0 */14 * *'
  workflow_dispatch:

jobs:
  update-gfw-pac:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Update submodule to latest
        run: |
          git submodule update --remote --init vendor/gfw-pac

      - name: Generate gfw.pac from submodule data
        run: |
          ./gfw-pac.py -f gfw.pac -p "PROXY 127.0.0.1:3128" \
            --proxy-domains=proxy-domains.txt \
            --direct-domains=direct-domains.txt \
            --localtld-domains=local-tlds.txt \
            --ip-file=vendor/gfw-pac/cidrs-cn.txt

      - name: Generate gfw.template.pac
        run: |
          ./gfw-pac.py -f gfw.template.pac -p "__PROXY__" \
            --proxy-domains=proxy-domains.txt \
            --direct-domains=direct-domains.txt \
            --localtld-domains=local-tlds.txt \
            --ip-file=vendor/gfw-pac/cidrs-cn.txt

      - name: Commit changes
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add .
          git commit -m "chore: update gfw.pac and gfw.template.pac from submodule"

      - name: Push changes
        uses: ad-m/github-push-action@master
        with:
          github_token: ${{ secrets.PUSH_TOKEN }}
          branch: submodule-data-source
